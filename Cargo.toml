[package]
name = "scissors"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Geoffrey Guéret <geoffrey@gueret.dev>"]
description = "Editor-based content approval, git-commit style"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ggueret/scissors"
homepage = "https://github.com/ggueret/scissors"
readme = "README.md"
keywords = ["cli", "editor", "approval", "scissors", "review"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    "pyproject.toml",
    "tests/",
    "fuzz/",
    "/scissors-*.md",
]

[lib]
name = "scissors"
path = "src/lib.rs"

[[bin]]
name = "scissors"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
shell-words = "1.1"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
serial_test = "3.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
